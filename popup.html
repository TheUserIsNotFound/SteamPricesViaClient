<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Steam Prices</title>
    <style>
        body {
            width: 270px;
            margin: 0;
            padding: 14px;
            background: #1b2838;
            color: #c7d5e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            user-select: none;
        }
        h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 6px;
        }
        .section {
            margin-bottom: 12px;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
            cursor: pointer;
        }
        .toggle-row input {
            cursor: pointer;
            accent-color: #66c0f4;
            width: 15px;
            height: 15px;
        }
        .rate-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .rate-row input {
            width: 80px;
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #4b6177;
            background: #101822;
            color: #fff;
            font-size: 13px;
            text-align: right;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        button {
            padding: 7px 10px;
            border: none;
            border-radius: 4px;
            background: #2a475e;
            color: #ffffff;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover {
            background: #66c0f4;
            color: #101822;
        }
        button.primary {
            background: #1a9fff;
            color: #fff;
            font-weight: 600;
        }
        button.primary:hover {
            background: #66c0f4;
        }
        #status {
            margin-top: 8px;
            font-size: 11px;
            color: #8f98a0;
            text-align: center;
            min-height: 15px;
        }
    </style>
</head>
<body>
    <h3>Отображаемые валюты</h3>
    <div class="section">
        <label class="toggle-row">
            <span>Гривны (UAH ₴)</span>
            <input type="checkbox" id="show-UAH">
        </label>
        <label class="toggle-row">
            <span>Рубли (RUB ₽)</span>
            <input type="checkbox" id="show-RUB">
        </label>
        <label class="toggle-row">
            <span>Тенге (KZT ₸)</span>
            <input type="checkbox" id="show-KZT">
        </label>
    </div>

    <h3>Курс за 1 гривну (₴)</h3>
    <div class="section">
        <div class="rate-row">
            <span>UAH → RUB:</span>
            <input type="text" id="rate-RUB" placeholder="Авто">
        </div>
        <div class="rate-row">
            <span>UAH → KZT:</span>
            <input type="text" id="rate-KZT" placeholder="Авто">
        </div>
    </div>

    <div class="btn-group">
        <button id="btn-save-manual" class="primary">Сохранить ручной курс</button>
        <button id="btn-refresh">🔄 Обновить курс из сети</button>
        <button id="btn-reset">🗑️ Сбросить ручной курс</button>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
